services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  knowledge-base:
    build: .
    command: python build_knowledge_base.py
    environment:
      CHROMA_PATH: /app/chroma_incidents
    volumes:
      - chroma-data:/app/chroma_incidents
      - ./data:/app/data

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      CHROMA_PATH: /app/chroma_incidents
    volumes:
      - chroma-data:/app/chroma_incidents
      - ./data:/app/data
    depends_on:
      knowledge-base:
        condition: service_completed_successfully
    restart: unless-stopped

  detector:
    build: .
    command: python anomaly_detector.py
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHROMA_PATH: /app/chroma_incidents
    volumes:
      - chroma-data:/app/chroma_incidents
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      knowledge-base:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped

  producer:
    build: .
    command: sh -c "python fetch_data.py && python producer.py"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_SOURCE: OpenStack
      LOG_FILE_PATH: data/OpenStack_2k.log
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      detector:
        condition: service_started

volumes:
  chroma-data:
